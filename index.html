<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="In January 2027, Sam will run 25 ultramarathons in 25 days to fund New Zealand's first national brain tumour registry." />
    <link rel="canonical" href="https://www.bigbrainfoundation.org/sams-big-brain-run" />
    <meta property="og:title" content="Sam's Big Brain Run | Fund NZ's First Brain Tumour Registry" />
    <meta property="og:description" content="In January 2027, Sam will run 25 ultramarathons in 25 days to fund New Zealand's first national brain tumour registry." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bigbrainfoundation.org/sams-big-brain-run" />
    <meta property="og:image" content="https://www.bigbrainfoundation.org/social/sams-big-brain-run.webp" />
    <meta property="og:image:alt" content="Sam running for New Zealand's first national brain tumour registry" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sam's Big Brain Run | Fund NZ's First Brain Tumour Registry" />
    <meta name="twitter:description" content="In January 2027, Sam will run 25 ultramarathons in 25 days to fund New Zealand's first national brain tumour registry." />
    <meta name="twitter:image" content="https://www.bigbrainfoundation.org/social/sams-big-brain-run.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Sam's Big Brain Run | Fund NZ's First Brain Tumour Registry</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Sam's Big Brain Run",
        "description": "Sam Saunt-Lord will run 25 consecutive ultramarathons down New Zealand's North Island to fund New Zealand's first national brain tumour registry.",
        "startDate": "2027-01",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "location": {
          "@type": "Place",
          "name": "New Zealand's North Island",
          "address": { "@type": "PostalAddress", "addressCountry": "NZ" }
        },
        "organizer": {
          "@type": "Organization",
          "name": "Big Brain Foundation",
          "url": "https://www.bigbrainfoundation.org"
        },
        "url": "https://www.bigbrainfoundation.org/sams-big-brain-run"
      }
    </script>
  </head>
  <body>
    <script>
      const redirect = sessionStorage.getItem("redirect");

      if (redirect) {
        sessionStorage.removeItem("redirect");
        window.history.replaceState(null, "", redirect);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
